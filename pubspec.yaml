name: flutter_starter
description: 'A reusable Flutter starter with auth, routing, local storage, i18n, REST API helpers, and common UI components.'
publish_to: 'none'

####################################################################################################

version: 1.6.0+17
# changelog generator : auto-changelog --template keepachangelog --hide-credit -v [version-name]

environment:
  sdk: '>=3.8.0 <4.0.0'

####################################################################################################

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  get_it: ^9.3.0
  logger: ^2.8.0
  share_plus: ^13.2.0
  collection: ^1.19.1
  flutter_phoenix: ^1.1.1
  package_info_plus: ^10.2.0
  introduction_screen: ^5.0.1
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8 # dart run flutter_native_splash:create
  flutter_dotenv: ^6.0.1
  go_router: ^18.0.1
  another_flutter_splash_screen: ^1.2.1
  settings_ui: ^3.0.1
  modal_bottom_sheet: ^3.0.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  flutter_widget_from_html_core: ^0.17.4
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  slang: ^4.19.2
  slang_flutter: ^4.18.0
  injectable: ^3.0.0
  marionette_flutter: ^0.6.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.5
  build_runner: ^2.16.1 # dart run build_runner build --delete-conflicting-outputs
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0 # dart run icons_launcher:create
  rename_app: ^1.6.6 # dart run rename_app:main all="My App Name"
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  hive_ce_generator: ^1.11.2
  injectable_generator: ^3.0.2
  go_router_builder: ^4.5.0
  change_app_package_name: ^1.5.0 # dart run change_app_package_name:main com.new.package.name
  marionette_mcp: ^0.6.0

####################################################################################################

# All icons launcher declinations have size 900x900
icons_launcher:
  image_path: assets/images/launcher/icon.png
  platforms:
    android:
      enable: true
      image_path: assets/images/launcher/icon.png
      # adaptive_background_color: '#ffffff'
      adaptive_background_image: assets/images/launcher/background.png
      adaptive_foreground_image: assets/images/launcher/foreground.png
      adaptive_round_image: assets/images/launcher/icon_round.png
      adaptive_monochrome_image: assets/images/launcher/icon_monochrome.png
    ios:
      enable: true
      image_path: assets/images/launcher/icon.png
    web:
      enable: true
      image_path: assets/images/launcher/icon.png
      favicon_path: assets/images/launcher/foreground.png
    macos:
      enable: true
      image_path: assets/images/launcher/icon.png
    windows:
      enable: false
      image_path: assets/images/launcher/icon.png
    linux:
      enable: false
      image_path: assets/images/launcher/icon.png

# No logo: the launcher icon is already shown by the app's own splashScreenBody
# (see lib/view/redirection.dart) right after this native splash, so showing it
# twice is redundant. On Android 12+, simply omitting `image` does NOT mean "no
# icon" -- the OS then auto-derives one from the adaptive launcher icon and
# masks it into a circle, cropping any square artwork's corners. Passing a
# fully transparent placeholder is what actually renders no visible logo.
flutter_native_splash:
  color: '#353839'
  color_dark: '#262626'
  fullscreen: true
  android_12:
    image: assets/images/launcher/blank_splash_icon.png
    icon_background_color: '#353839'
    color: '#353839'
    image_dark: assets/images/launcher/blank_splash_icon.png
    icon_background_color_dark: '#262626'
    color_dark: '#262626'

flutter:
  uses-material-design: true

  assets:
    - .env
    #LAUNCHER
    - assets/images/launcher/icon.png
    # IMAGES
    - assets/images/
    - assets/images/tutorial/fr/
    - assets/images/tutorial/en/
    - assets/images/tutorial/de/
    - assets/images/tutorial/es/
    - assets/images/tutorial/pt/
    # I18N
    - assets/i18n/
    # DOCS
    - assets/docs/fr/
    - assets/docs/en/
    - assets/docs/de/
    - assets/docs/es/
    - assets/docs/pt/

  # Only the weights/styles the app actually renders are bundled: Montserrat
  # (theme font) at 400/500/600/700 plus italic for the <i> notes in the
  # explanations, Open Sans (onboarding) at 600/700.
  fonts:
    - family: montserrat
      fonts:
        - asset: assets/fonts/montserrat/montserrat_italic.ttf
          style: italic
        - asset: assets/fonts/montserrat/montserrat_bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/montserrat_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/montserrat_medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/montserrat_regular.ttf
          style: normal
          weight: 400

    - family: open_sans
      fonts:
        - asset: assets/fonts/open_sans/open_sans_bold.ttf
          weight: 700
        - asset: assets/fonts/open_sans/open_sans_semi_bold.ttf
          weight: 600
