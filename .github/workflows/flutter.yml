name: Flutter

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
          dart format .

      - name: Create .env
        run: touch .env

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          flutter test --coverage

      # Generated files (*.g.dart, *.config.dart) are excluded from the
      # count -- they're regenerated glue, not code this repo's tests are
      # meant to exercise. Files no test imports (main.dart, app.dart,
      # constants) don't appear in lcov.info at all, so they don't count
      # either. 75% is a floor a few points below current hand-written
      # coverage (~80%), meant to catch regressions; raise it as more tests
      # are added rather than treating it as a target.
      - name: Enforce coverage floor
        run: |
          awk -v thresh=75 '
            /^SF:/ { file=$0; sub("^SF:", "", file); skip = (file ~ /\.g\.dart$/ || file ~ /\.config\.dart$/) }
            /^LF:/ { n=$0; sub("^LF:", "", n); if (!skip) lf += n }
            /^LH:/ { n=$0; sub("^LH:", "", n); if (!skip) lh += n }
            END {
              pct = (lf > 0) ? (lh / lf * 100) : 0
              printf "Hand-written line coverage: %.2f%% (%d/%d), floor is %d%%\n", pct, lh, lf, thresh
              if (pct + 0 < thresh) exit 1
            }
          ' coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 14

  build-android:
    name: Build Android APK
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # Signed with the debug key unless the project has its own key.properties +
      # keystore configured (see android/app/build.gradle). Good enough to smoke-test
      # that Android release builds succeed and to hand out for manual QA; a real
      # release keystore is required before publishing to the Play Store.
      # --flavor prod: a tagged release is a production build (see README >
      # Build Flavors) -- also doubles as CI coverage for the flavor setup itself.
      - name: Build release APK
        run: flutter build apk --release --flavor prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS (unsigned)
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # No code signing yet (that requires an Apple Developer account and
      # certificates), so this only proves the iOS side still compiles -- it
      # does not produce an installable/distributable .ipa. Add signing
      # (Fastlane match, App Store Connect API key, etc.) once the app ships
      # on iOS.
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
